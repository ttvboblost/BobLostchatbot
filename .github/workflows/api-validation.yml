name: Validate and prepare Zenifra backend

on:
  push:
    branches: [main, "fix/zenifra-npm-workspace"]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - ".github/workflows/api-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - ".github/workflows/api-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: boblost_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d boblost_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/boblost_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh PNPM lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Generate npm lockfile for Zenifra
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --short -- package-lock.json pnpm-lock.yaml)" ]; then
            git add package-lock.json pnpm-lock.yaml
            git commit -m "Add npm lockfile for Zenifra deployment"
            git push
          fi
      - name: Install exactly as Zenifra does
        run: npm ci --no-audit --no-fund
      - name: Build shared TypeScript packages
        run: npm run typecheck:libs
      - name: Typecheck backend
        run: npm run typecheck --workspace=@workspace/api-server
      - name: Build production API
        run: npm run build
      - name: Verify production entrypoint
        run: test -s artifacts/api-server/dist/index.mjs
      - name: Prepare test database
        run: npm run push --workspace=@workspace/db
      - name: Run backend tests
        env:
          RUN_DB_INTEGRATION_TESTS: "true"
        run: npm run test --workspace=@workspace/api-server
